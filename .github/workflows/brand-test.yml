name: Ujian logo page (sementara)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pasang ffmpeg
        run: |
          U=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ff.tar.xz" "$U" && mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1 && echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: pip install -q -r requirements.txt
      - env:
          POSTOLAB_URL: ${{ vars.POSTOLAB_URL || 'https://www.postolab.com' }}
          POSTOLAB_API_KEY: ${{ secrets.POSTOLAB_API_KEY }}
        run: |
          python - <<'PY'
          import os, subprocess, time, branding
          from postolab_relay import Postolab
          api = Postolab(os.environ["POSTOLAB_URL"].rstrip("/"), os.environ["POSTOLAB_API_KEY"])
          info = branding.page_info(api)
          pics = sum(1 for v in info.values() if v["picture"])
          print("PAGES", len(info), "dengan gambar:", pics)
          subprocess.run(["ffmpeg","-y","-loglevel","error","-f","lavfi","-i","testsrc2=s=720x1280:r=30:d=60","-f","lavfi","-i","sine=d=60","-shortest","-c:v","libx264","-preset","veryfast","-pix_fmt","yuv420p","-c:a","aac","/tmp/t.mp4"], check=True)
          pid = next((k for k, v in info.items() if v["picture"]), next(iter(info), ""))
          pic = branding._download_picture(pid, info.get(pid, {}).get("picture", ""))
          print("PAGE", info.get(pid, {}).get("name"), "gambar:", bool(pic))
          x, y, w, h = branding.brand_png(info[pid]["name"], pic, 720, 1280, "/tmp/b.png")
          t = time.time(); branding.compose("/tmp/t.mp4", [("/tmp/b.png", x, y)], "/tmp/o.mp4")
          print("ENCODE 60s video:", round(time.time() - t, 1), "saat")
          subprocess.run(["ffmpeg","-y","-loglevel","error","-ss","2","-i","/tmp/o.mp4","-frames:v","1","/tmp/frame.jpg"], check=True)
          print("FRAME_URL", api.upload("/tmp/frame.jpg", "image/jpeg"))
          PY
