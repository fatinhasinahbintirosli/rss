name: FB Reels RSS

on:
  schedule:
    - cron: "17 */2 * * *"     # setiap 2 jam (UTC). Tukar ke "17 * * * *" untuk setiap jam.
  workflow_dispatch: {}

concurrency:
  group: fb-reels-rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-24.04          # dikunci: ubuntu-latest sedang ditukar ke Ubuntu 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang pakej
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          pip install -U --pre yt-dlp   # nightly: pembaikan Facebook/YouTube keluar di sini dahulu
          V=$(pip show yt-dlp | awk '/^Version/{print $2}')
          pip install "yt-dlp[default,curl-cffi]==$V"   # pakej tambahan yang sepadan dengan versi nightly
          yt-dlp --list-impersonate-targets | head -12 || true
          yt-dlp --version
          python -m playwright install --with-deps chromium

      - name: Sediakan cookies (pilihan)
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        if: env.FB_COOKIES != ''
        run: printf '%s' "$FB_COOKIES" > cookies.txt && echo "COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"

      - name: Jana RSS
        env:
          # Jika halaman Auto Reels di Postolab sudah dipasang, sumber diambil dari situ (setiap profile).
          # FB_PAGE_URLS hanya dipakai jika Postolab belum ada halaman itu.
          POSTOLAB_URL: ${{ vars.POSTOLAB_URL || 'https://postolab.com' }}
          POSTOLAB_API_KEY: ${{ secrets.POSTOLAB_API_KEY }}
          FB_PAGE_URLS: ${{ vars.FB_PAGE_URLS || 'https://www.facebook.com/penmerahdotcoms/reels/,https://www.facebook.com/buletinmalaysiakuu/reels/' }}
          MAX_REELS: ${{ vars.MAX_REELS || '10' }}
          KEEP_ITEMS: ${{ vars.KEEP_ITEMS || '30' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'rss/' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: python fb_reels_rss.py

      - name: Simpan maklumat diagnostik
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            debug/
            out/
          retention-days: 7
          if-no-files-found: ignore

  relay:
    needs: rss
    if: always()
    runs-on: ubuntu-24.04          # dikunci: ubuntu-latest sedang ditukar ke Ubuntu 26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg + ffprobe versi siap (static build dari GitHub BtbN/FFmpeg-Builds).
      # (Tindakan FedericoCarboni/setup-ffmpeg rosak sejak laman johnvansickle berubah.)
      # Sandaran: apt-get jika muat turun gagal.
      - name: Pasang ffmpeg
        timeout-minutes: 6
        run: |
          set -e
          U=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ff.tar.xz" "$U"; then
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1
          else
            echo "Muat turun gagal, guna apt-get"
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Pasang pakej
        timeout-minutes: 8
        run: |
          pip install -r requirements.txt
          pip install -U --pre yt-dlp   # nightly: pembaikan Facebook/YouTube keluar di sini dahulu
          V=$(pip show yt-dlp | awk '/^Version/{print $2}')
          pip install "yt-dlp[default,curl-cffi]==$V"   # pakej tambahan yang sepadan dengan versi nightly
          yt-dlp --list-impersonate-targets | head -12 || true

      - name: Semak video dan jadual ke Postolab
        # Tetapan (profile, sumber, page, slot, mod percubaan, kandungan dibenarkan) diambil dari
        # halaman Auto Reels di Postolab. Pembolehubah di bawah POSTOLAB_API_KEY hanya untuk mod lama
        # (sebelum halaman itu dipasang) dan boleh dibiarkan.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'rss/' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          POSTOLAB_URL: ${{ vars.POSTOLAB_URL || 'https://postolab.com' }}
          POSTOLAB_API_KEY: ${{ secrets.POSTOLAB_API_KEY }}
          POSTOLAB_PROFILE: ${{ vars.POSTOLAB_PROFILE || 'deli' }}
          SOURCE_PAGE_MAP: ${{ vars.SOURCE_PAGE_MAP }}
          EXCLUDE_PAGE_IDS: ${{ vars.EXCLUDE_PAGE_IDS }}
          YELLOW_MODE: ${{ vars.YELLOW_MODE || 'skip' }}
          MAX_VIDEOS_PER_RUN: ${{ vars.MAX_VIDEOS_PER_RUN || '5' }}
          STAGGER: ${{ vars.STAGGER || '0' }}
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          RECHECK: ${{ vars.RECHECK || '0' }}
          ALLOW_WARN: ${{ vars.ALLOW_WARN || 'low_resolution,text_profanity,visual_third_party_watermark' }}
          APPROVE_IDS: ${{ vars.APPROVE_IDS }}
          FORCE_BLOCK: ${{ vars.FORCE_BLOCK || 'visual_graphic_violence,visual_self_harm,text_self_harm,visual_disturbing' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}        # pilihan: Claude tulis caption
          CLAUDE_BASE_URL: ${{ vars.CLAUDE_BASE_URL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          VISUAL_PROVIDER: gemini
          TRANSCRIBE_PROVIDER: none
        run: python postolab_relay.py
