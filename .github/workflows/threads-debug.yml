name: Threads debug (sementara)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - env:
          THREADS_COOKIES: ${{ secrets.THREADS_COOKIES }}
        run: |
          printf '%s' "$THREADS_COOKIES" > tc.txt
          python - <<'PY'
          import re, requests, http.cookiejar as cj, link_relay as lr, fb_reels_rss as fbr
          url = "https://www.threads.com/@xtra_my/post/DfjyRI1lvRt"
          ck = fbr._netscape_cookies("tc.txt")
          print("cookies:", len(ck), sorted({c["domain"] for c in ck}), "sessionid" in {c["name"] for c in ck})
          s = requests.Session()
          for c in ck: s.cookies.set(c["name"], c["value"], domain=c["domain"], path=c.get("path","/"))
          for page in lr.threads_candidates(url):
              t = s.get(page, headers={"User-Agent": lr.UA}, timeout=30).text
              print("REQ", page, len(t), "vv:", t.count("video_versions"), "vids:", [lr._mp4_key(v)[:40] for v in lr.page_video_list(t)], "restricted:", "available to everyone" in t)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              ctx = b.new_context(user_agent=lr.UA, viewport={"width":1280,"height":900})
              ctx.add_cookies([c for c in ck if re.search(r"threads\.|instagram\.", c["domain"])])
              pg = ctx.new_page(); seen=[]
              pg.on("response", lambda r: seen.append((r.url, (r.headers or {}).get("content-type",""), (r.headers or {}).get("content-length",""))) if (".mp4" in r.url or (r.headers or {}).get("content-type","").startswith("video")) else None)
              pg.goto(lr.threads_candidates(url)[1], wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(9000)
              html = pg.content()
              print("BROWSER html", len(html), "vv:", html.count("video_versions"), "vids:", [lr._mp4_key(v)[:40] for v in lr.page_video_list(html)])
              print("videos:", pg.evaluate("() => Array.from(document.querySelectorAll('video')).map(v => (v.currentSrc||v.src||'').slice(0,80))"))
              print("text:", pg.inner_text("body")[:200].replace("\n"," | "))
              for u,ctp,ln in seen[:8]:
                  m = re.search(r"efg=([^&]+)", u)
                  print("SEEN", ctp, ln, lr._mp4_key(u)[:50], "bytestart" in u, (m.group(1)[:60] if m else ""))
              b.close()
          PY
