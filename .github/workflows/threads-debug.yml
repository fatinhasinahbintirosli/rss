name: Threads debug (sementara)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - env:
          THREADS_COOKIES: ${{ secrets.THREADS_COOKIES }}
        run: |
          printf '%s' "$THREADS_COOKIES" > tc.txt
          THREADS_COOKIES_FILE=tc.txt python - <<'PY'
          import os, link_relay as lr
          u = "https://www.threads.com/share/BCPv-0_nxC"
          print("RESOLVED", lr.resolve_threads_share(u))
          v = lr.fetch_video(u, "/tmp", 15)
          print("OK", os.path.getsize(v["path"]), v.get("duration"), (v.get("title") or "")[:80])
          PY
