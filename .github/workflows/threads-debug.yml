name: Threads debug (sementara)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - run: |
          python - <<'PY'
          import re, requests, link_relay as lr
          url = "https://www.threads.com/@rahmatsapri/post/DfkfdWHD7SE"
          for page in lr.threads_candidates(url):
              r = requests.get(page, headers={"User-Agent": lr.UA, "Accept-Language": "ms,en;q=0.8"}, timeout=30)
              t = r.text
              print("PAGE", page, r.status_code, len(t), "video_versions:", t.count("video_versions"),
                    "mp4:", len(re.findall(r"\.mp4", t)), "<video:", t.count("<video"), "login:", "login" in t.lower())
              print("  vids:", [lr._mp4_key(v) for v in lr.page_video_list(t)])
              open("/tmp/" + page.rsplit("/",1)[-1] + ".html", "w").write(t)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              pg = b.new_page(user_agent=lr.UA, viewport={"width":1280,"height":900})
              seen=[]
              pg.on("response", lambda r: seen.append((r.url[:120], (r.headers or {}).get("content-type",""))) if (".mp4" in r.url or "video" in (r.headers or {}).get("content-type","")) else None)
              for page in lr.threads_candidates(url):
                  pg.goto(page, wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(8000)
                  info = pg.evaluate("() => ({v: Array.from(document.querySelectorAll('video')).map(v=>[v.currentSrc||v.src, v.poster?1:0]), img: document.querySelectorAll('img').length, txt: document.body.innerText.slice(0,300)})")
                  print("BROWSER", page, info)
                  pg.screenshot(path="/tmp/" + page.rsplit("/",1)[-1] + ".png")
              print("seen", seen[:10])
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: threads-debug, path: /tmp/*.png }
