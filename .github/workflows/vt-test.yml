name: Ujian tulisan atas video (sementara)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Pasang ffmpeg
        run: |
          U=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ff.tar.xz" "$U" && mkdir -p "$RUNNER_TEMP/ffmpeg" && tar -xf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1 && echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Fon emoji (tulisan atas video)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/fonts/NotoColorEmoji.ttf" https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf \
            && echo "VIDEO_TEXT_EMOJI_FONT=$RUNNER_TEMP/fonts/NotoColorEmoji.ttf" >> "$GITHUB_ENV"
          ls /usr/share/fonts/truetype/
      - run: |
          pip install -q -r requirements.txt
          pip install -q -U --pre yt-dlp
      - run: |
          python - <<'PY'
          import link_relay as lr, video_text as vt, subprocess, time
          v = lr.fetch_video("https://www.tiktok.com/@tiktok/video/7106594312292453675", "/tmp", 15)
          t = time.time()
          out, info = vt.apply(v["path"], {"teks_video": "Mana Driver Dia? Gila Seram", "emoji": "😱😱😱", "mood": "seram", "teks_sedia_ada": []}, ["x"])
          print("INFO", info, "secs", round(time.time() - t, 1), vt.video_size(v["path"]))
          subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-ss", "3", "-i", out, "-frames:v", "1", "/tmp/frame.jpg"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: frame, path: /tmp/frame.jpg }
